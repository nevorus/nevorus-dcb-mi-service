name: Build & Push to Harbor

on:
  push:
    branches: [ "main", "dev", "feature/*", "hotfix/*", "release/*" ]

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY_URL }}
  DOCKER_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
  DOCKER_PASS: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get project info from pom.xml
        id: project-info
        run: |
          ARTIFACT_ID=$(grep -m1 '<artifactId>' pom.xml | sed 's/.*<artifactId>\(.*\)<\/artifactId>.*/\1/')
          echo "ARTIFACT_ID=$ARTIFACT_ID" >> $GITHUB_OUTPUT

      - name: Compute next version
        id: version
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            MAJOR=0; MINOR=1; PATCH=0
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
          fi

          case "$BRANCH_NAME" in
            main)
              MINOR=$((MINOR + 1))
              PATCH=0
              NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
              ;;
            release/*)
              MINOR=$((MINOR + 1))
              PATCH=0
              NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
              ;;
            hotfix/*)
              PATCH=$((PATCH + 1))
              NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
              ;;
            develop|dev|feature/*)
              PATCH=$((PATCH + 1))
              NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
              ;;
            *)
              PATCH=$((PATCH + 1))
              NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
              ;;
            esac

          echo "VERSION=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "BRANCH=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Computed version: $NEXT_VERSION (branch: $BRANCH_NAME)"

      - name: Update pom.xml version
        run: |
          sed -i "0,/<version>.*<\/version>/s|<version>.*</version>|<version>${{ steps.version.outputs.VERSION }}</version>|" pom.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PASS }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ steps.project-info.outputs.ARTIFACT_ID }}:${{ steps.version.outputs.VERSION }}
            ${{ env.DOCKER_REGISTRY }}/${{ steps.project-info.outputs.ARTIFACT_ID }}:latest

      - name: Update Helm values and chart version
        run: |
          sed -i "s|^\( *repository:\).*|\1 $DOCKER_REGISTRY/${{ steps.project-info.outputs.ARTIFACT_ID }}|" ./k8s/values.yaml
          sed -i "s|^\( *tag:\).*|\1 \"${{ steps.version.outputs.VERSION }}\"|" ./k8s/values.yaml
          sed -i "s|^\(appVersion:\).*|\1 \"${{ steps.version.outputs.VERSION }}\"|" ./k8s/Chart.yaml

      - name: Commit and push updated files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "elhadjiserigne.toure@nevorus.com"
          git config user.name "hadj92"

          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          if git diff --quiet ./k8s/values.yaml ./k8s/Chart.yaml pom.xml; then
            echo "Aucun changement à committer."
            exit 0
          fi

          git add ./k8s/values.yaml ./k8s/Chart.yaml pom.xml
          git commit -m "CI: Update Helm chart and pom.xml for ${{ steps.project-info.outputs.ARTIFACT_ID }}:${{ steps.version.outputs.VERSION }}"
          git push "https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git" "HEAD:$BRANCH_NAME"

      - name: Create Git tag
        run: |
          git tag "v${{ steps.version.outputs.VERSION }}"
          git push "https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git" \
            "v${{ steps.version.outputs.VERSION }}"